line-length = 120
target-version = "py313"

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008", # FastAPI uses function calls (Depends/File/Query) in defaults by design
  "E501", # long lines are handled by the formatter, not the linter
]

[lint.per-file-ignores]
"alembic/versions/*" = ["I001"] # generated migrations keep their own import order
